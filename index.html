<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্বাগতম - আমার ওয়েবসাইটে</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #ffeb3b;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #e0e0e0;
        }
        .btn {
            display: inline-block;
            background: #ff5722;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        .btn:hover {
            background: #e64a19;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>আপনাদের এখানে স্বাগতম!</h1>
        <p>আমাদের সাইটে আপনাকে স্বাগতম জানাই। এখানে আসেন, ঘুরে দেখুন এবং ভালো লাগলে দেখতে পারেন এখানে কী কী দারুণ জিনিস রয়েছে।</p>
        <a href="#" class="btn">আরও দেখুন</a>
    </div>

</body>
</html>
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Lab Login</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        } 
        .login-box { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            width: 300px; 
            text-align: center; 
        } 
        h2 { 
            color: #333; 
            margin-bottom: 5px; 
        } 
        .sub-text { 
            color: #666; 
            font-size: 14px; 
            margin-bottom: 20px; 
            font-weight: bold; 
        } 
        label { 
            font-weight: bold; 
            color: #555; 
            font-size: 14px; 
            display: block; 
            text-align: left; 
        } 
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 10px; 
            margin: 8px 0 15px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        } 
        button { 
            background-color: #4CAF50; 
            color: white; 
            padding: 10px; 
            width: 100%; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
            margin-top: 10px; 
        } 
        button:hover { 
            background-color: #45a049; 
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Lab Login</h2>
        <p class="sub-text">এখানে আপনার পছন্দের বাংলা লেখা লিখুন</p>
        <form method="GET">
            <label>Username:</label>
            <input type="text" name="username">
            <label>Password:</label>
            <input type="password" name="password">
            <button type="submit">Login Test</button>
        </form>
    </div>
</body><form action="https://api.web3forms.com/submit" method="POST">
  <!-- আপনার কপি করা Access Key এখানে পেস্ট করুন -->
  <input type="hidden" name="access_key" value="এখানে_কপি_করা_Access_Key_পেস্ট_করুন">

  <label for="name">Name:</label><br>
  <input type="text" id="name" name="name" required><br><br>

  <label for="email">Email:</label><br>
  <input type="email" id="email" name="email" required><br><br>

  <button type="submit">Submit</button>
</form>
